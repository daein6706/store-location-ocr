<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR 로케이션 조회</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; }
    #reader { width: 100%; max-width: 520px; }
    .box { margin-top: 12px; padding: 12px; border: 1px solid #eee; border-radius: 12px; background: #fafafa; }
    button { padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; background: #fff; cursor: pointer; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #e5e5e5; padding: 8px; font-size: 14px; }
    th { background: #f3f3f3; text-align: left; }
    table th:first-child, table td:first-child { white-space: nowrap; min-width: 90px; } /* 로케이션 줄바꿈 방지 */
  </style>
</head>
<body>
  <h3>상품코드 QR 스캔 → 로케이션 조회</h3>

  <div id="reader"></div>

  <div class="row">
    <button id="btnStart">스캔 시작</button>
    <button id="btnStop">스캔 중지</button>
  </div>

  <div class="box">
    <div><b>상태:</b> <span id="status">대기</span></div>
    <div><b>스캔 코드:</b> <span id="code"></span></div>
    <div id="result"></div>
  </div>

  <!-- QR 스캔 라이브러리(무료) -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
    // ✅ 너의 Apps Script 웹앱 URL
    const API_BASE = "https://script.google.com/macros/s/AKfycbxb4ml2a21fRCe_4ooK6qdZtlU1qoErKHVHxCGUyAsLgasPNDHBLtyayftg6qIUvYFMfA/exec";

    const statusEl = document.getElementById("status");
    const codeEl = document.getElementById("code");
    const resultEl = document.getElementById("result");

    const html5QrCode = new Html5Qrcode("reader");
    let scanning = false;

    document.getElementById("btnStart").onclick = async () => {
      if (scanning) return;
      scanning = true;
      statusEl.textContent = "카메라 시작...";
      resultEl.innerHTML = "";

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async (decodedText) => {
            statusEl.textContent = "스캔 완료 → 조회 중...";
            const code = decodedText.trim();
            codeEl.textContent = code;

            // 중복 스캔 방지: 일단 멈추고 조회
            await stopScan_();

            // Apps Script 호출 (GitHub Pages라 CORS 회피 위해 JSONP 사용)
            lookupByCodeJSONP_(code);
          },
          (err) => { /* 무시 가능 */ }
        );

        statusEl.textContent = "스캔 중... QR을 박스 안에 맞춰줘";
      } catch (e) {
        scanning = false;
        statusEl.textContent = "스캔 시작 실패: " + e;
      }
    };

    document.getElementById("btnStop").onclick = async () => {
      await stopScan_();
      statusEl.textContent = "중지";
    };

    async function stopScan_() {
      if (!scanning) return;
      try { await html5QrCode.stop(); } catch(e) {}
      try { html5QrCode.clear(); } catch(e) {}
      scanning = false;
    }

    function lookupByCodeJSONP_(code) {
      statusEl.textContent = "조회 중: " + code;

      const cb = "__cb_" + Math.random().toString(36).slice(2);
      const cleanup = (script) => {
        delete window[cb];
        if (script && script.parentNode) script.parentNode.removeChild(script);
      };

      window[cb] = (data) => {
        try {
          if (!data.ok) {
            statusEl.textContent = "조회 실패: " + (data.reason || data.error);
            resultEl.innerHTML = "";
            return;
          }

          statusEl.textContent = "완료";
          const loc = String(data.location || "").replace(/\s+/g, "");

          resultEl.innerHTML = `
            <table>
              <thead><tr><th>로케이션</th><th>상품명</th><th>상품코드</th></tr></thead>
              <tbody>
                <tr>
                  <td>${escapeHtml_(loc)}</td>
                  <td>${escapeHtml_(data.name)}</td>
                  <td>${escapeHtml_(data.code)}</td>
                </tr>
              </tbody>
            </table>
          `;
        } finally {
          cleanup(script);
        }
      };

      const url = `${API_BASE}?code=${encodeURIComponent(code)}&callback=${encodeURIComponent(cb)}`;
      const script = document.createElement("script");
      script.src = url;
      script.onerror = () => {
        statusEl.textContent = "조회 실패: 네트워크/권한 문제";
        cleanup(script);
      };
      document.body.appendChild(script);
    }

    function escapeHtml_(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
